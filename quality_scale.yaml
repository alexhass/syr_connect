# Quality Scale Status for SYR Connect Integration
# Custom Integration - Status: Platinum Tier ✅🏆 (Highest Achievable)

rules:
  # BRONZE TIER
  action-setup:
    status: exempt
    comment: Integration registers no service actions; devices are controlled through entities (buttons, selects, switches, valves, update)
  
  appropriate-polling:
    status: done
    comment: Polling interval is configurable via the options flow (default 60 s; minimum 60 s for the cloud and 10 s for the local API, maximum 600 s)
  
  brands:
    status: done
    comment: Brand images are shipped in custom_components/syr_connect/brand/ (local brand images, Home Assistant 2026.3+)
  
  common-modules:
    status: done
    comment: |
      - coordinator.py for the data update coordinators
      - entity.py for the base entity (SyrConnectEntity)
      - aiosyrconnect/ for the communication with the cloud and the local API (xml_api.py, json_api.py), a library without Home Assistant dependencies
      - helpers/ for shared helpers, one module per topic (DeviceInfo, unique_id, registry cleanup, status values)
  
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py (81 tests) covers the user steps, options, reauth (cloud and local), reconfigure and the error handling
  
  config-flow:
    status: done
    comment: |
      - Config Flow with UI setup implemented
      - Options Flow for scan interval available
      - Translations provided via translations/*.json (no strings.json required)
      - Every form field has a data_description
      - ConfigEntry.data for credentials, ConfigEntry.options for scan interval
  
  dependency-transparency:
    status: done
    comment: External dependencies (pycryptodomex, defusedxml) are declared in manifest.json and published on PyPI; aiohttp comes with Home Assistant. The protocol library aiosyrconnect is bundled in the integration and not published on PyPI
  
  docs-actions:
    status: exempt
    comment: Integration registers no service actions

  docs-conditions:
    status: exempt
    comment: Integration provides no conditions
  
  docs-high-level-description:
    status: done
    comment: README.md describes SYR Connect cloud service and devices
  
  docs-installation-instructions:
    status: done
    comment: README.md contains installation and setup instructions
  
  docs-removal-instructions:
    status: done
    comment: README.md section "Removal" describes how to remove the integration

  docs-triggers:
    status: exempt
    comment: Integration provides no triggers
  
  entity-event-setup:
    status: exempt
    comment: Integration does not use Event entities
  
  entity-unique-id:
    status: done
    comment: All entities have unique_id (entry_id + device_id + sensor_key)
  
  has-entity-name:
    status: done
    comment: Entities use has_entity_name = True
  
  runtime-data:
    status: done
    comment: Uses ConfigEntry.runtime_data instead of hass.data
  
  test-before-configure:
    status: done
    comment: validate_input() tests API connection before creating ConfigEntry
  
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh() tests connection, raises ConfigEntryNotReady on error
  
  unique-config-entry:
    status: done
    comment: _abort_if_unique_id_configured() prevents duplicates; unique_id "json_<serial number>" for local entries (read from the device at setup; older entries get it at their next setup) and "xml_<cf_bundle_identifier>_<username in lowercase>" for cloud entries, as the cloud has no account ID and ignores the letter case of the username

  # SILVER TIER
  action-exceptions:
    status: done
    comment: Buttons, selects, switches, valves and the update entity raise HomeAssistantError or ServiceValidationError with translations on failures
  
  config-entry-unloading:
    status: done
    comment: async_unload_entry() implemented
  
  docs-configuration-parameters:
    status: done
    comment: Scan interval described in README.md section "Configuration options"
  
  docs-installation-parameters:
    status: done
    comment: README.md section "Configuration" describes the cloud parameters (service, username, password) and the local parameters (model, host)
  
  entity-unavailable:
    status: done
    comment: Entities are unavailable while the cloud reports the device offline (dst 0/1), when it is gone from the account or when an unexpected error stops the update. Deliberate deviation (AGENTS.md) - temporary connection errors keep the last values instead, because the cloud often answers with timeouts, maintenance pages or broken data for a short time
  
  integration-owner:
    status: done
    comment: Codeowner @alexhass in manifest.json
  
  log-when-unavailable:
    status: done
    comment: A failure of the update, of a project or of a device is logged once as a warning and its recovery once at info level; repeats are logged at debug level
  
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 1 set in every platform
  
  reauthentication-flow:
    status: done
    comment: ConfigEntryAuthFailed starts the reauth flow; cloud entries ask for new credentials (reauth_confirm), local entries for model and host (reauth_confirm_local). Another username aborts with wrong_account, as the account of an entry must not change
  
  test-coverage:
    status: done
    comment: 2935 tests; 100 % line coverage of custom_components/syr_connect is required (pytest-cov) and reported to codecov

  # GOLD TIER
  devices:
    status: done
    comment: Integration creates devices with DeviceInfo
  
  diagnostics:
    status: done
    comment: Diagnostics platform implemented in diagnostics.py
  
  discovery:
    status: exempt
    comment: Cloud devices come from the account; no discovery mechanism (mDNS, SSDP, DHCP) is known for the local API
  
  discovery-update-info:
    status: exempt
    comment: No discovery, so there is no discovery information to update; a new host of a local device is set with the reconfigure flow
  
  docs-data-update:
    status: done
    comment: README.md section "How data is updated" describes the polling of the cloud and the local API
  
  docs-examples:
    status: done
    comment: README.md section "Automation examples" with 6 automations (alerts, reports, monitoring)
  
  docs-known-limitations:
    status: done
    comment: README.md section "Known limitations" lists all constraints
  
  docs-supported-devices:
    status: done
    comment: README.md section "Supported devices" lists compatible models
  
  docs-supported-functions:
    status: done
    comment: README.md section "Supported functionality" describes all features
  
  docs-troubleshooting:
    status: done
    comment: README.md extended troubleshooting with diagnostics, auth, connectivity
  
  docs-use-cases:
    status: done
    comment: README.md section "Use cases & examples" with practical scenarios
  
  dynamic-devices:
    status: done
    comment: Every platform adds the entities of a device that appears after the setup with the next coordinator update (entity.async_add_device_entities)
  
  entity-category:
    status: done
    comment: EntityCategory.DIAGNOSTIC for technical sensors (Serial, MAC, IP, Firmware, Config)
  
  entity-device-class:
    status: done
    comment: Device classes set for Volume, Consumption, Duration
  
  entity-disabled-by-default:
    status: done
    comment: 92 of 262 sensor descriptions, 3 of 52 select descriptions and 2 of 9 binary sensor descriptions are disabled by default (technical values, leak protection profiles)
  
  entity-translations:
    status: done
    comment: Translations available in 8 languages (de, en, es, fr, it, nl, pl, pt) in translations/*.json
  
  exception-translations:
    status: done
    comment: Every exception shown to the user (HomeAssistantError, ServiceValidationError, ConfigEntryNotReady, ConfigEntryAuthFailed, UpdateFailed) uses translation_domain and translation_key; tests/test_translations.py checks keys and placeholders
  
  icon-translations:
    status: done
    comment: Icons, state icons and range icons (getBAT 0 V) are defined in icons.json by translation key; code only sets the icons of the reset buttons, which depend on the status of another key
  
  reconfiguration-flow:
    status: done
    comment: Reconfigure flow implemented with async_step_reconfigure; cloud entries keep their account (another username aborts with wrong_account), local entries may change model and host, but not the device (another serial number aborts with wrong_device)
  
  repair-issues:
    status: done
    comment: Temporary errors are only logged (see AGENTS.md); a failure that lasts longer than 1 hour creates an informing repair issue, which is deleted with the first successful update. The device_offline issues of older versions are deleted
  
  stale-devices:
    status: done
    comment: Devices removed from the account are removed together with their entities at the setup and after every update with a complete device list; the cloud device lists are fetched every 30 minutes
  
  # PLATINUM TIER
  async-dependency:
    status: done
    comment: The library aiosyrconnect does all I/O with aiohttp; defusedxml (XML parsing) and pycryptodomex (AES) perform no I/O
  
  inject-websession:
    status: done
    comment: Integration uses async_get_clientsession and passes aiohttp session to all API clients
  
  strict-typing:
    status: done
    comment: mypy runs with the strict settings of Home Assistant core (mypy.ini); the typed SyrConnectConfigEntry is used for every entry that carries the runtime data; py.typed marker file present for PEP 561 compliance

# Summary
# Bronze: 20/20 completed (100%) ✅ (5 exempt rules)
# Silver: 10/10 completed (100%) ✅
# Gold: 21/21 completed (100%) ✅🥇 (3 exempt rules)
# Platinum: 3/3 completed (100%) ✅🏆
# Total Platinum Tier Rules: 3 (3 done, 0 exempt, 0 pending)
# Rating: Custom Integration - Platinum Tier achieved! 🏆✨🎉
