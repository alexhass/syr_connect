# Quality Scale Status for SYR Connect Integration
# Custom Integration - Status: Platinum Tier ✅🏆 (Highest Achievable)

rules:
  # BRONZE TIER
  action-setup:
    status: exempt
    comment: Integration has no service actions defined (only Button entities)
  
  appropriate-polling:
    status: done
    comment: Polling interval is configurable (default 60s) via Options Flow
  
  brands:
    status: done
    comment: Branding assets are included in the repository; brand images are generated by scripts/generate_brand_images.py
  
  common-modules:
    status: done
    comment: |
      - coordinator.py for the data update coordinators
      - entity.py for the base entity (SyrConnectEntity)
      - api_xml.py and api_json.py for the cloud and the local API
      - helpers.py for shared helpers (DeviceInfo, unique_id, registry cleanup)
  
  config-flow-test-coverage:
    status: done
    comment: tests/test_config_flow.py (92 tests) covers the user steps, options, reauth (cloud and local), reconfigure and the error handling
  
  config-flow:
    status: done
    comment: |
      - Config Flow with UI setup implemented
      - Options Flow for scan interval available
      - Translations provided via translations/*.json (no strings.json required)
      - Every form field has a data_description
      - ConfigEntry.data for credentials, ConfigEntry.options for scan interval
  
  dependency-transparency:
    status: done
    comment: Dependencies declared in manifest.json (pycryptodomex, defusedxml); no hidden runtime deps
  
  docs-actions:
    status: exempt
    comment: No service actions - only Button entities
  
  docs-high-level-description:
    status: done
    comment: README.md describes SYR Connect cloud service and devices
  
  docs-installation-instructions:
    status: done
    comment: README.md contains installation and setup instructions
  
  docs-removal-instructions:
    status: done
    comment: Removal instructions added to README.md
  
  entity-event-setup:
    status: exempt
    comment: Integration does not use Event entities
  
  entity-unique-id:
    status: done
    comment: All entities have unique_id (entry_id + device_id + sensor_key)
  
  has-entity-name:
    status: done
    comment: Entities use has_entity_name = True
  
  runtime-data:
    status: done
    comment: Uses ConfigEntry.runtime_data instead of hass.data
  
  test-before-configure:
    status: done
    comment: validate_input() tests API connection before creating ConfigEntry
  
  test-before-setup:
    status: done
    comment: async_config_entry_first_refresh() tests connection, raises ConfigEntryNotReady on error
  
  unique-config-entry:
    status: done
    comment: _abort_if_unique_id_configured() prevents duplicates; unique_id "xml_<cf_bundle_identifier>_<username>" or "json_<host>"

  # SILVER TIER
  action-exceptions:
    status: done
    comment: Buttons, selects, switches, valves and the update entity raise HomeAssistantError or ServiceValidationError with translations on failures
  
  config-entry-unloading:
    status: done
    comment: async_unload_entry() implemented
  
  docs-configuration-parameters:
    status: done
    comment: Scan interval described in README.md under Configuration Options
  
  docs-installation-parameters:
    status: done
    comment: Username and password described in README
  
  entity-unavailable:
    status: done
    comment: Entities check device['available'] and set unavailable on errors
  
  integration-owner:
    status: done
    comment: Codeowner @alexhass in manifest.json
  
  log-when-unavailable:
    status: done
    comment: Coordinator logs warning on device errors, marks as unavailable
  
  parallel-updates:
    status: done
    comment: PARALLEL_UPDATES = 1 set in every platform
  
  reauthentication-flow:
    status: done
    comment: ConfigEntryAuthFailed starts the reauth flow; cloud entries ask for new credentials (reauth_confirm), local entries for model and host (reauth_confirm_local)
  
  test-coverage:
    status: done
    comment: 2393 tests; 100 % line coverage of custom_components/syr_connect is required (pytest-cov) and reported to codecov

  # GOLD TIER
  devices:
    status: done
    comment: Integration creates devices with DeviceInfo
  
  diagnostics:
    status: done
    comment: Diagnostics platform implemented in diagnostics.py
  
  discovery:
    status: exempt
    comment: Cloud devices come from the account; no discovery mechanism (mDNS, SSDP, DHCP) is known for the local API
  
  discovery-update-info:
    status: exempt
    comment: No discovery, so there is no discovery information to update; a new host of a local device is set with the reconfigure flow
  
  docs-data-update:
    status: done
    comment: README.md section "How Data is Updated" describes polling mechanism
  
  docs-examples:
    status: done
    comment: README.md section "Automation Examples" with 6 automations (alerts, reports, monitoring)
  
  docs-known-limitations:
    status: done
    comment: README.md section "Known Limitations" lists all constraints
  
  docs-supported-devices:
    status: done
    comment: README.md section "Supported Devices" lists compatible models
  
  docs-supported-functions:
    status: done
    comment: README.md section "Supported Functionality" describes all features
  
  docs-troubleshooting:
    status: done
    comment: README.md extended troubleshooting with diagnostics, auth, connectivity
  
  docs-use-cases:
    status: done
    comment: README.md section "Use Cases & Examples" with practical scenarios
  
  dynamic-devices:
    status: done
    comment: Every platform adds the entities of a device that appears after the setup with the next coordinator update (entity.async_add_device_entities)
  
  entity-category:
    status: done
    comment: EntityCategory.DIAGNOSTIC for technical sensors (Serial, MAC, IP, Firmware, Config)
  
  entity-device-class:
    status: done
    comment: Device classes set for Volume, Consumption, Duration
  
  entity-disabled-by-default:
    status: done
    comment: 83 of 223 sensor descriptions and 4 selects are disabled by default (technical values, leak protection profiles)
  
  entity-translations:
    status: done
    comment: Translations available in 8 languages (de, en, es, fr, it, nl, pl, pt) in translations/*.json
  
  exception-translations:
    status: done
    comment: Every exception shown to the user (HomeAssistantError, ServiceValidationError, ConfigEntryNotReady, ConfigEntryAuthFailed, UpdateFailed) uses translation_domain and translation_key; tests/test_translations.py checks keys and placeholders
  
  icon-translations:
    status: done
    comment: Icons and state icons are defined in icons.json by translation key; code only sets the getBAT icon (depends on the battery device class)
  
  reconfiguration-flow:
    status: done
    comment: Reconfigure flow implemented with async_step_reconfigure
  
  repair-issues:
    status: exempt
    comment: No repair issues by design (temporary errors are only logged, see AGENTS.md); the device_offline issues of older versions are deleted
  
  stale-devices:
    status: done
    comment: Devices removed from the account are detached at the next setup of the entry if the device list was complete; until then their entities are unavailable
  
  # PLATINUM TIER
  async-dependency:
    status: done
    comment: All dependencies are async - aiohttp for HTTP, defusedxml for secure XML parsing, pycryptodomex for crypto
  
  inject-websession:
    status: done
    comment: Integration uses async_get_clientsession and passes aiohttp session to all API clients
  
  strict-typing:
    status: done
    comment: mypy runs with the strict settings of Home Assistant core (mypy.ini); py.typed marker file present for PEP 561 compliance

# Summary
# Bronze: 18/18 completed (100%) ✅ (3 exempt rules)
# Silver: 10/10 completed (100%) ✅
# Gold: 21/21 completed (100%) ✅🥇 (3 exempt rules)
# Platinum: 3/3 completed (100%) ✅🏆
# Total Platinum Tier Rules: 3 (3 done, 0 exempt, 0 pending)
# Rating: Custom Integration - Platinum Tier achieved! 🏆✨🎉
