# mypy configuration follows Home Assistant core, including the settings core uses for
# integrations with strict typing (Platinum quality scale):
# https://github.com/home-assistant/core/blob/dev/mypy.ini
[mypy]
python_version = 3.14
platform = linux
show_error_codes = true
follow_imports = normal
local_partial_types = true
strict_equality = true
strict_bytes = true
no_implicit_optional = true
warn_incomplete_stub = true
warn_redundant_casts = true
warn_unused_ignores = true
enable_error_code = deprecated, explicit-override, ignore-without-code, redundant-self, truthy-iterable
disable_error_code = annotation-unchecked, import-not-found, import-untyped
extra_checks = false
check_untyped_defs = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
warn_return_any = true
warn_unreachable = true
# Checked by a plain `mypy` call; module names start at the repository root, so the
# integration is custom_components.syr_connect for the scripts, the tests and itself
files = custom_components/syr_connect, scripts, tests
explicit_package_bases = true
# Exclude non-code directories
exclude = (^translations/)

# Tests change the state of entities between asserts (coordinator updates, installs).
# mypy keeps the narrowed value of a property and reports the asserts after the change
# as unreachable, so this check is off for the tests, like in Home Assistant core.
[mypy-tests.*]
warn_unreachable = false
