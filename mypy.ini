[mypy]
python_version = 3.14
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
warn_unused_configs = True
# Allow gradual typing; do not fail on untyped defs yet
disallow_untyped_defs = False
# Exclude non-code directories
exclude = (^tests/|^translations/)

# HA 2026.9+ aliases voluptuous to probatio at runtime, but mypy still sees the real voluptuous types.
[mypy-syr_connect.config_flow]
disable_error_code = arg-type
