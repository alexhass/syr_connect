[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# The respx plugin (a dependency of pytest-homeassistant) imports httpx before
# homeassistant (since 2026.11.2) aliases httpx to httpx2, which then fails with
# "httpx was already imported". The tests do not use respx.
addopts = -p no:respx
# Tell pytest-homeassistant where to find custom components
pythonpath = custom_components
filterwarnings =
    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff