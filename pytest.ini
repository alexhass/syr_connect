[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Tell pytest-homeassistant where to find custom components
pythonpath = custom_components
filterwarnings =
    ignore:Inheritance class HomeAssistantApplication from web.Application is discouraged:DeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:backoff