# Dependabot opens a pull request when a newer version of a dependency exists.
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
#
# Only the GitHub Actions in .github/workflows/ are updated. Actions pinned to a
# branch (hacs/action@main, hassfest@master) always run the latest version anyway.
# Python packages are left out on purpose: requirements-dev.txt uses version
# ranges, and the requirements in manifest.json follow Home Assistant core.

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
