repos:
  - repo: https://github.com/charliermarsh/ruff-pre-commit
    rev: main
    hooks:
      - id: ruff
  - repo: local
    hooks:
      - id: ruff-local
        name: ruff (venv)
        entry: ruff
        language: python
        additional_dependencies: ["ruff"]
        pass_filenames: false
        args: ["check", "."]
