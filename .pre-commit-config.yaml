repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: https://github.com/streetsidesoftware/cspell-cli
    rev: v10.4.0
    hooks:
      - id: cspell
        files: ^README\.de\.md$
        additional_dependencies:
          - "@cspell/dict-de-de@4.1.3"
  - repo: local
    hooks:
      - id: ruff-local
        name: ruff (venv)
        entry: ruff
        language: python
        additional_dependencies: ["ruff"]
        pass_filenames: false
        args: ["check", "."]
      - id: ruff-format-local
        name: ruff format (venv)
        entry: ruff
        language: python
        additional_dependencies: ["ruff"]
        pass_filenames: false
        args: ["format", "--check", "."]
      # A product name in a German compound stays unchanged: SYR Connect-Konto
      - id: german-compounds
        name: German compounds with product names
        entry: '\b(SYR-Connect|Home-Assistant)\b'
        language: pygrep
        files: ^(README\.de\.md|custom_components/syr_connect/translations/de\.json)$
