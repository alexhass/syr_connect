repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: main
    hooks:
      - id: ruff-check
        args:
          - --fix
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
  - repo: local
    hooks:
      - id: ruff-local
        name: ruff (venv)
        entry: ruff
        language: python
        additional_dependencies: ["ruff"]
        pass_filenames: false
        args: ["check", "."]
      - id: ruff-format-local
        name: ruff format (venv)
        entry: ruff
        language: python
        additional_dependencies: ["ruff"]
        pass_filenames: false
        args: ["format", "--check", "."]
